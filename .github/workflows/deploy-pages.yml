name: Deploy web build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AETHER_PUBLIC_REPO_TOKEN: ${{ secrets.AETHER_PUBLIC_REPO_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.127

      - name: Install wasm-bindgen
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Build web distribution
        run: ./scripts/build-web.sh --prefix /aether-public

      - name: Publish to public repository
        if: env.AETHER_PUBLIC_REPO_TOKEN != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ env.AETHER_PUBLIC_REPO_TOKEN }}
          external_repository: michaelpixelscoder/aether-public
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
