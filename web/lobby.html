<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="__AETHER_PREFIX__/">
  <title>Aether Isles — Lobby</title>
  <link rel="stylesheet" href="__AETHER_PREFIX__/style.css">
</head>
<body class="lobby">
  <main>
    <p class="eyebrow">AETHER ISLES</p>
    <h1>Prototype Lobby</h1>
    <p class="intro">Choose a game or systems experiment.</p>
    <section id="games" class="games"><p>Loading games...</p></section>
  </main>
  <canvas id="aether-canvas" aria-label="Aether game canvas"></canvas>
  <header id="game-header" class="game-header">
    <a id="lobby-button" class="lobby-button" href="__AETHER_PREFIX__/">Lobby</a>
    <div class="game-header-info">
      <strong id="game-title">Loading game</strong>
      <span id="game-help"></span>
    </div>
  </header>
  <aside class="engine-status"><span id="engine-status">Preparing shared engine</span><div class="engine-track"><div id="engine-progress"></div></div></aside>
  <div id="game-loading" class="game-loading">
    <div class="game-loading-card"><p id="game-loading-title">Loading game</p><div class="engine-track"><div id="game-loading-progress"></div></div><span id="game-loading-label">Preparing game assets</span></div>
  </div>
  <script type="module" src="__AETHER_PREFIX__/lobby-loader.js"></script>
</body>
</html>
