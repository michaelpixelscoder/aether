[package]
name = "lobby_web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
bevy.workspace = true
sandbox_game = { package = "sandbox", path = "../../games/sandbox" }
runner_game = { package = "runner", path = "../../games/runner" }
