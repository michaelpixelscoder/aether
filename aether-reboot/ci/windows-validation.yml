# Template only. Not installed in .github/workflows and not run remotely.
# Place at the root of a future repository containing this workspace.
name: Aether validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-and-web:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/setup.ps1
      - name: Format tests native and WASM
        run: ./tools/verify.ps1 -Web
      - name: Keep diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aether-validation
          path: docs/evidence/*.log
          if-no-files-found: error
          retention-days: 14
